{% extends "base.html" %}
{% block title %}{{ item and 'Редактирование урока' or 'Новый урок' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="page-title mb-0"><i class="bi bi-calendar-plus"></i>
                {{ item and 'Редактирование урока' or 'Добавление урока в расписание' }}
            </h4>
            <a href="{{ url_for('schedule.schedule_list') }}" class="btn btn-outline-secondary btn-sm">К расписанию</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Класс *</label>
                            <select name="class_id" class="form-select" required>
                                <option value="">— выберите —</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}" {% if item and item.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Учитель</label>
                            <select name="teacher_id" class="form-select">
                                {% for t in teachers %}
                                <option value="{{ t.id }}"
                                        {% if item and item.teacher_id == t.id %}selected{% endif %}>{{ t.full_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">День недели *</label>
                            <select name="day_of_week" class="form-select" required>
                                {% for d in days %}
                                <option value="{{ loop.index }}" {% if item and item.day_of_week == loop.index %}selected{% endif %}>
                                    {{ d }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Номер урока *</label>
                            <input type="number" name="lesson_number" class="form-control" required min="1" max="10"
                                   value="{{ item.lesson_number if item else '' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Начало *</label>
                            <input type="time" name="start_time" class="form-control" required
                                   value="{{ item.start_time if item else '' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Окончание *</label>
                            <input type="time" name="end_time" class="form-control" required
                                   value="{{ item.end_time if item else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Предмет</label>
                            <input type="text" name="subject" class="form-control" value="{{ item.subject if item else 'Музыка' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Кабинет</label>
                            <input type="text" name="room" class="form-control" value="{{ item.room if item else '' }}"
                                   placeholder="каб. 12">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Учебный год</label>
                            <input type="text" name="year" class="form-control" value="{{ item.year if item else '2025/2026' }}">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <a href="{{ url_for('schedule.schedule_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
