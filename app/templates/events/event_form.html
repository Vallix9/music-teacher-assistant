{% extends "base.html" %}
{% block title %}{{ item and 'Редактирование мероприятия' or 'Новое мероприятие' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><i class="bi bi-calendar-plus"></i>
                {{ item and 'Редактирование мероприятия' or 'Добавление мероприятия' }}
            </h4>
            <a href="{{ url_for('events.events_list') }}" class="btn btn-outline-secondary btn-sm">К мероприятиям</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Название *</label>
                            <input type="text" name="title" class="form-control" required
                                   placeholder="Концерт «Весенняя пастораль»"
                                   value="{{ item.title if item else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Класс</label>
                            <select name="class_id" class="form-select">
                                <option value="">— все классы —</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}" {% if item and item.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Дата *</label>
                            <input type="date" name="event_date" class="form-control" required
                                   value="{{ item.event_date.strftime('%Y-%m-%d') if item else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Время</label>
                            <input type="time" name="event_time" class="form-control"
                                   value="{{ item.event_time if item and item.event_time else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Статус</label>
                            <select name="status" class="form-select">
                                {% for s in ['Запланировано', 'Проведено', 'Отменено'] %}
                                <option value="{{ s }}" {% if item and item.status == s %}selected{% endif %}>{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Место проведения</label>
                            <input type="text" name="place" class="form-control" placeholder="Актовый зал"
                                   value="{{ item.place if item and item.place else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Описание / программа</label>
                            <textarea name="description" class="form-control" rows="4">{{ item.description if item and item.description else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <a href="{{ url_for('events.events_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
