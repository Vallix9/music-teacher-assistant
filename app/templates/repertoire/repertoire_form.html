{% extends "base.html" %}
{% block title %}{{ item and 'Редактирование произведения' or 'Новое произведение' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><i class="bi bi-music-note"></i>
                {{ item and 'Редактирование произведения' or 'Добавление произведения' }}
            </h4>
            <a href="{{ url_for('repertoire.repertoire_list') }}" class="btn btn-outline-secondary btn-sm">К репертуару</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Название *</label>
                            <input type="text" name="title" class="form-control" required
                                   placeholder="Марш" value="{{ item.title if item else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Жанр</label>
                            <input type="text" name="genre" class="form-control" placeholder="Фольклор"
                                   value="{{ item.genre if item and item.genre else '' }}">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Композитор</label>
                            <input type="text" name="composer" class="form-control"
                                   value="{{ item.composer if item and item.composer else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Класс</label>
                            <select name="class_id" class="form-select">
                                <option value="">— общий —</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}" {% if item and item.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Сложность</label>
                            <select name="difficulty" class="form-select">
                                {% for d in ['Лёгкий', 'Средний', 'Сложный'] %}
                                <option value="{{ d }}" {% if item and item.difficulty == d %}selected{% endif %}>{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Длительность</label>
                            <input type="text" name="duration" class="form-control" placeholder="2 мин 30 с"
                                   value="{{ item.duration if item and item.duration else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Учебный год</label>
                            <input type="text" name="year" class="form-control" value="{{ item.year if item and item.year else '2025/2026' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ссылка на запись</label>
                            <input type="url" name="link" class="form-control" placeholder="https://youtube.com/..."
                                   value="{{ item.link if item and item.link else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Примечания</label>
                            <textarea name="notes" class="form-control" rows="3">{{ item.notes if item and item.notes else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <a href="{{ url_for('repertoire.repertoire_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
