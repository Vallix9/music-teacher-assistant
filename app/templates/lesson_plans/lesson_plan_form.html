{% extends "base.html" %}
{% block title %}{{ item and 'Редактирование конспекта' or 'Новый план-конспект' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="page-title mb-0"><i class="bi bi-journal-plus"></i>
                {{ item and 'Редактирование плана-конспекта' or 'Новый план-конспект урока' }}
            </h4>
            <a href="{{ url_for('lesson_plans.lesson_plans_list') }}" class="btn btn-outline-secondary btn-sm">К списку</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Название (тема урока) *</label>
                            <input type="text" name="title" class="form-control" required
                                   value="{{ item.title if item else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Класс</label>
                            <select name="class_id" class="form-select">
                                <option value="">— все классы —</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}" {% if item and item.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Тип урока</label>
                            <select name="lesson_type" class="form-select">
                                {% for t in ['Урок', 'Повторение', 'Закрепление', 'Контрольный', 'Проектный', 'Праздничный'] %}
                                <option value="{{ t }}" {% if item and item.lesson_type == t %}selected{% endif %}>{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Дата урока</label>
                            <input type="date" name="lesson_date" class="form-control"
                                   value="{{ item.lesson_date.strftime('%Y-%m-%d') if item and item.lesson_date else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Длительность</label>
                            <input type="text" name="duration" class="form-control"
                                   value="{{ item.duration if item and item.duration else '45 мин' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Цель урока</label>
                            <textarea name="goal" class="form-control" rows="2" placeholder="Ознакомить с ...; развивать ...">{{ item.goal if item and item.goal else '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Задачи урока</label>
                            <textarea name="tasks" class="form-control" rows="3" placeholder="Образовательные&#10;Развивающие&#10;Воспитательные">{{ item.tasks if item and item.tasks else '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ход урока</label>
                            <textarea name="structure" class="form-control" rows="8" placeholder="1. Организационный момент&#10;2. Повторение&#10;3. Изучение нового материала&#10;4. Физкультминутка&#10;5. Практическая работа&#10;6. Итог урока">{{ item.structure if item and item.structure else '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Оборудование</label>
                            <textarea name="equipment" class="form-control" rows="3" placeholder="Фортепиано, проектор, нотные тетради">{{ item.equipment if item and item.equipment else '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Домашнее задание</label>
                            <textarea name="homework" class="form-control" rows="3" placeholder="Выучить песню..., спеть solo">{{ item.homework if item and item.homework else '' }}</textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Критерии оценивания</label>
                            <textarea name="criteria" class="form-control" rows="2" placeholder="5 — исполнение точное, выразительное">{{ item.criteria if item and item.criteria else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <a href="{{ url_for('lesson_plans.lesson_plans_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
