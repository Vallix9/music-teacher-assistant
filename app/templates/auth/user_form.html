{% extends "base.html" %}
{% block title %}{{ user and 'Редактирование' or 'Новый пользователь' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">
                <i class="bi bi-person-badge"></i>
                {{ user and 'Редактирование пользователя' or 'Добавление пользователя' }}
            </h4>
            <a href="{{ url_for('auth.users_list') }}" class="btn btn-outline-secondary btn-sm">К списку</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Логин *</label>
                            <input type="text" name="username" class="form-control" required
                                   value="{{ user.username if user else '' }}" {% if user %}readonly{% endif %}>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">E-mail *</label>
                            <input type="email" name="email" class="form-control" required
                                   value="{{ user.email if user else '' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">ФИО *</label>
                            <input type="text" name="full_name" class="form-control" required
                                   value="{{ user.full_name if user else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Роль *</label>
                            <select name="role" class="form-select">
                                <option value="admin" {% if user and user.role=='admin' %}selected{% endif %}>Администратор</option>
                                <option value="teacher" {% if user and user.role=='teacher' %}selected{% endif %}>Учитель музыки</option>
                                <option value="parent" {% if user and user.role=='parent' %}selected{% endif %}>Родитель</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Телефон</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ user.phone if user else '' }}" placeholder="+7 900 000-00-00">
                        </div>
                        <div class="col-12">
                            <label class="form-label">
                                Пароль {{ '*' if not user else '(оставьте пустым, если не менять)' }}
                            </label>
                            <input type="password" name="password" class="form-control" {% if not user %}required{% endif %}
                                   placeholder="Новый пароль">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                        <a href="{{ url_for('auth.users_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
