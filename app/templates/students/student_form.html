{% extends "base.html" %}
{% block title %}{{ student and 'Редактирование ученика' or 'Новый ученик' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="page-title mb-0"><i class="bi bi-person"></i>
                {{ student and 'Редактирование ученика' or 'Добавление ученика' }}
            </h4>
            <a href="{{ url_for('students.classes_list') }}" class="btn btn-outline-secondary btn-sm">К классам</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">ФИО *</label>
                            <input type="text" name="full_name" class="form-control" required
                                   value="{{ student.full_name if student else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Класс *</label>
                            <select name="class_id" class="form-select" required>
                                <option value="">— выберите —</option>
                                {% for c in classes %}
                                <option value="{{ c.id }}" {% if student and student.class_id == c.id %}selected{% endif %}>
                                    {{ c.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Дата рождения</label>
                            <input type="date" name="birth_date" class="form-control"
                                   value="{{ student.birth_date.strftime('%Y-%m-%d') if student and student.birth_date else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Телефон</label>
                            <input type="text" name="phone" class="form-control"
                                   value="{{ student.phone if student else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Родитель (учётная запись)</label>
                            <select name="parent_id" class="form-select">
                                <option value="">— не назначен —</option>
                                {% for p in parents %}
                                <option value="{{ p.id }}" {% if student and student.parent_id == p.id %}selected{% endif %}>
                                    {{ p.full_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Remarks / заметки</label>
                            <textarea name="notes" class="form-control" rows="3"
                                      placeholder="Особенности ученика, достижения, замечания">{{ student.notes if student and student.notes else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                        <a href="{{ url_for('students.classes_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
